<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラッキーパネル</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      background-color: #f5f5f5;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 15px;
      color: #333;
      font-size: clamp(20px, 5vw, 28px);
      text-align: center;
    }

    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      padding: 10px 20px;
      font-size: clamp(14px, 3vw, 16px);
      cursor: pointer;
      border: 2px solid #333;
      background-color: white;
      border-radius: 5px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #e0e0e0;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      font-size: clamp(14px, 3.5vw, 18px);
      font-weight: bold;
      margin-bottom: 15px;
      color: #555;
      text-align: center;
      padding: 0 10px;
    }

    .grid {
      display: grid;
      gap: 5px;
      background-color: #ddd;
      padding: 5px;
      border-radius: 5px;
      max-width: 100%;
    }

    .grid.size-4x3 {
      grid-template-columns: repeat(4, minmax(65px, 80px));
      grid-template-rows: repeat(3, minmax(65px, 80px));
    }

    .grid.size-4x4 {
      grid-template-columns: repeat(4, minmax(60px, 80px));
      grid-template-rows: repeat(4, minmax(60px, 80px));
    }

    .grid.size-5x4 {
      grid-template-columns: repeat(5, minmax(55px, 80px));
      grid-template-rows: repeat(4, minmax(55px, 80px));
    }

    .cell {
      background-color: white;
      border: 2px solid #999;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(12px, 2.5vw, 14px);
      color: rgba(0, 0, 0, 0.3);
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .cell:hover {
      border-color: #333;
      transform: scale(1.05);
    }

    .cell:focus {
      outline: none;
    }

    .cell.selected {
      border-color: #FF4444;
      border-width: 4px;
      box-shadow: 0 0 20px rgba(255, 68, 68, 0.8), inset 0 0 10px rgba(255, 68, 68, 0.3);
      transform: scale(1.08);
      position: relative;
      z-index: 10;
    }

    .hidden {
      display: none;
    }

    /* スマホ対応 */
    @media (max-width: 480px) {
      .grid.size-4x3 {
        grid-template-columns: repeat(4, calc((100vw - 40px) / 4));
        grid-template-rows: repeat(3, calc((100vw - 40px) / 4));
      }

      .grid.size-4x4 {
        grid-template-columns: repeat(4, calc((100vw - 40px) / 4));
        grid-template-rows: repeat(4, calc((100vw - 40px) / 4));
      }

      .grid.size-5x4 {
        grid-template-columns: repeat(5, calc((100vw - 40px) / 5));
        grid-template-rows: repeat(4, calc((100vw - 40px) / 5));
      }

      .controls {
        flex-wrap: wrap;
        justify-content: center;
      }

      button {
        padding: 8px 16px;
      }
    }

    @media (max-width: 380px) {
      .grid {
        gap: 3px;
        padding: 3px;
      }

      .cell {
        border-width: 1px;
      }

      .cell.selected {
        border-width: 2px;
      }
    }
  </style>
</head>
<body>
  <h1>ラッキーパネル</h1>

  <div id="sizeSelection" class="controls">
    <button onclick="startGame(12)">4x3で開始</button>
    <button onclick="startGame(16)">4x4で開始</button>
    <button onclick="startGame(20)">5x4で開始</button>
  </div>

  <div id="gameControls" class="controls hidden">
    <button id="undoButton" onclick="undoLastColor()" disabled>取り消し</button>
    <button onclick="resetGame()">リセット</button>
  </div>

  <div id="status" class="status"></div>

  <div id="grid" class="grid"></div>

  <script>
    // 9色のパステルカラー
    const PAIR_COLORS = [
      '#FFB3BA', // パステルレッド
      '#87CEEB', // パステルブルー（濃いめ）
      '#BAFFC9', // パステルグリーン
      '#FFD6E8', // パステルピンク
      '#B19CD9', // パステルパープル（濃いめ）
      '#FFDFBA', // パステルオレンジ
      '#7FDBDB', // パステルシアン（暗めで緑寄り）
      '#E8FFBA', // パステルライム
      '#DDA0DD', // パステルラベンダー（プラム系）
    ];

    const LUCKY_COLOR = '#FFD700'; // 濃い黄色（ゴールド）
    const MISS_COLOR = '#A0A0A0';  // グレー
    const INITIAL_COLOR = '#FFFFFF'; // 白

    let gridSize = 0;
    let cells = [];
    let mode = 'idle'; // idle, coloring, shuffle
    let currentColorIndex = 0;
    let coloringStep = 0; // 0 or 1 (1つ目のパネルか2つ目のパネルか)
    let selectedCell = null;
    let lastColoredCell = null; // 最後に色付けしたパネルのインデックス

    function startGame(size) {
      gridSize = size;
      cells = Array(size).fill(null).map(() => ({ color: INITIAL_COLOR }));
      mode = 'coloring';
      currentColorIndex = 0;
      coloringStep = 0;
      selectedCell = null;

      document.getElementById('sizeSelection').classList.add('hidden');
      document.getElementById('gameControls').classList.remove('hidden');

      const grid = document.getElementById('grid');
      if (size === 12) {
        grid.className = 'grid size-4x3';
      } else if (size === 16) {
        grid.className = 'grid size-4x4';
      } else {
        grid.className = 'grid size-5x4';
      }
      grid.innerHTML = '';

      for (let i = 0; i < size; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;
        cell.onclick = () => handleCellClick(i);
        updateCellDisplay(cell, i);
        grid.appendChild(cell);
      }

      updateStatus();
    }

    function handleCellClick(index) {
      if (cells[index].color !== INITIAL_COLOR && mode === 'coloring') {
        // すでに色がついている場合は何もしない
        return;
      }

      if (mode === 'coloring') {
        handleColoringMode(index);
      } else if (mode === 'shuffle') {
        handleShuffleMode(index);
      }
    }

    function handleColoringMode(index) {
      // グリッドサイズに応じてペア数を決定
      let pairCount;
      if (gridSize === 12) {
        pairCount = 5; // 4x3: 5ペア
      } else if (gridSize === 16) {
        pairCount = 7; // 4x4: 7ペア
      } else {
        pairCount = 9; // 5x4: 9ペア
      }
      const totalPairs = pairCount * 2;

      let color;
      const coloredCount = cells.filter(c => c.color !== INITIAL_COLOR).length;

      if (coloredCount < totalPairs) {
        // ペア色を割り当て
        color = PAIR_COLORS[currentColorIndex];
      } else if (coloredCount === totalPairs) {
        // チャンスパネル
        color = LUCKY_COLOR;
      } else {
        // シャッフルパネル
        color = MISS_COLOR;
      }

      cells[index].color = color;
      updateCellDisplay(document.querySelector(`[data-index="${index}"]`), index);

      // 最後に色付けしたセルを記録
      lastColoredCell = index;

      coloringStep++;
      if (coloringStep === 2) {
        // 2パネル目を塗り終えた
        coloringStep = 0;
        currentColorIndex++;
      }

      // 全パネルに色がついたかチェック
      if (cells.every(c => c.color !== INITIAL_COLOR)) {
        mode = 'shuffle';
        // シャッフルモードになったら取り消しボタンを無効化
        document.getElementById('undoButton').disabled = true;
      } else {
        // 取り消しボタンを有効化
        document.getElementById('undoButton').disabled = false;
      }

      updateStatus();
    }

    function handleShuffleMode(index) {
      if (selectedCell === null) {
        // 1つ目のパネルを選択
        selectedCell = index;
        const cell = document.querySelector(`[data-index="${index}"]`);
        cell.classList.add('selected');
        cell.blur(); // フォーカスを解除
        updateStatus();
      } else {
        // 2つ目のパネルを選択して色を交換
        const cell1 = selectedCell;
        const cell2 = index;

        // 色を交換
        const tempColor = cells[cell1].color;
        cells[cell1].color = cells[cell2].color;
        cells[cell2].color = tempColor;

        // 表示を更新
        updateCellDisplay(document.querySelector(`[data-index="${cell1}"]`), cell1);
        updateCellDisplay(document.querySelector(`[data-index="${cell2}"]`), cell2);

        // 選択状態をクリア
        const cell1Element = document.querySelector(`[data-index="${cell1}"]`);
        const cell2Element = document.querySelector(`[data-index="${cell2}"]`);
        cell1Element.classList.remove('selected');
        cell2Element.classList.remove('selected');
        cell1Element.blur(); // フォーカスを解除
        cell2Element.blur(); // フォーカスを解除
        selectedCell = null;
        updateStatus();
      }
    }

    function updateCellDisplay(cellElement, index) {
      cellElement.style.backgroundColor = cells[index].color;

      // 色に応じたラベルを表示
      const color = cells[index].color;
      if (color === INITIAL_COLOR) {
        // 初期状態（白）は何も表示しない
        cellElement.textContent = '';
      } else if (color === LUCKY_COLOR) {
        // チャンスパネル
        cellElement.textContent = '☆';
      } else if (color === MISS_COLOR) {
        // シャッフルパネル
        cellElement.textContent = '×';
      } else {
        // ペア色の場合は色番号（1～9）を表示
        const colorIndex = PAIR_COLORS.indexOf(color);
        if (colorIndex !== -1) {
          cellElement.textContent = colorIndex + 1;
        } else {
          cellElement.textContent = '';
        }
      }
    }

    function updateStatus() {
      const status = document.getElementById('status');

      if (mode === 'idle') {
        status.textContent = '';
      } else if (mode === 'coloring') {
        // グリッドサイズに応じてペア数を決定
        let pairCount;
        if (gridSize === 12) {
          pairCount = 5; // 4x3: 5ペア
        } else if (gridSize === 16) {
          pairCount = 7; // 4x4: 7ペア
        } else {
          pairCount = 9; // 5x4: 9ペア
        }
        const coloredCount = cells.filter(c => c.color !== INITIAL_COLOR).length;
        const totalPairs = pairCount * 2;

        if (coloredCount < totalPairs) {
          const currentPair = Math.floor(coloredCount / 2) + 1;
          const step = coloringStep + 1;
          status.textContent = `配置モード: ペア${currentPair} - ${step}つ目のパネルを選択`;
        } else if (coloredCount === totalPairs) {
          status.textContent = '配置モード: チャンスパネルを選択';
        } else {
          status.textContent = '配置モード: シャッフルパネルを選択';
        }
      } else if (mode === 'shuffle') {
        if (selectedCell === null) {
          status.textContent = 'シャッフルモード: 入れ替えるパネルを選択';
        } else {
          status.textContent = 'シャッフルモード: 入れ替え先パネルを選択';
        }
      }
    }

    function undoLastColor() {
      // 配置モードでない、または最後に色付けしたセルがない場合は何もしない
      if (mode !== 'coloring' || lastColoredCell === null) {
        return;
      }

      // 最後に色付けしたパネルの色を白に戻す
      cells[lastColoredCell].color = INITIAL_COLOR;
      updateCellDisplay(document.querySelector(`[data-index="${lastColoredCell}"]`), lastColoredCell);

      // coloringStepとcurrentColorIndexを調整
      if (coloringStep === 0) {
        // 2つ目を塗った直後なら、1つ目に戻す
        coloringStep = 1;
        currentColorIndex--;
      } else {
        // 1つ目を塗った直後なら、前のペアの2つ目に戻す
        coloringStep = 0;
      }

      // 取り消しボタンを無効化（連続取り消しを防ぐ）
      document.getElementById('undoButton').disabled = true;
      lastColoredCell = null;

      updateStatus();
    }

    function resetGame() {
      gridSize = 0;
      cells = [];
      mode = 'idle';
      currentColorIndex = 0;
      coloringStep = 0;
      selectedCell = null;
      lastColoredCell = null;

      document.getElementById('sizeSelection').classList.remove('hidden');
      document.getElementById('gameControls').classList.add('hidden');
      document.getElementById('grid').innerHTML = '';
      document.getElementById('undoButton').disabled = true;

      updateStatus();
    }

    // 初期状態の設定
    updateStatus();
  </script>
</body>
</html>
